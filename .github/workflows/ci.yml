name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: permissions_integration_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Permissions.slnx --force -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check transitive dependency vulnerabilities
        run: dotnet list Permissions.slnx package --vulnerable --include-transitive

      - name: Domain tests
        run: dotnet test Permissions.Domain.Tests/Permissions.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Application tests
        run: dotnet test Permissions.Application.Tests/Permissions.Application.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: API HTTP tests
        run: dotnet test Permissions.Api.Tests/Permissions.Api.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: PostgreSQL integration tests
        env:
          INTEGRATION_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=permissions_integration_disposable;Username=postgres;Password=postgres"
          PERMISSIONS_TEST_ALLOW_DESTRUCTIVE_DATABASE: disposable-tests-only
        run: dotnet test Permissions.Integration.Tests/Permissions.Integration.Tests.csproj --no-build --configuration Release --verbosity normal
